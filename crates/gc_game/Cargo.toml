[package]
name = "gc_game"
description = "The Grubcraft application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "grubcraft"
path = "src/main.rs"

[features]
# Frame and tick profiling with Tracy (https://github.com/wolfpld/tracy).
# Off by default: zero cost unless built with `--features profile`.
profile = ["dep:tracy-client"]
# Shift+R in the sandbox re-bakes `data/units.ron` from a repository checkout
# and tunes the types that changed. It pulls the data baker (and its parser)
# into the executable, so releases leave it out.
dev = ["dep:gc_bake"]

[dependencies]
bytemuck.workspace = true
gc_ai.workspace = true
gc_assets.workspace = true
gc_audio.workspace = true
gc_bake = { workspace = true, optional = true }
gc_data.workspace = true
gc_fixed.workspace = true
gc_map.workspace = true
gc_match.workspace = true
gc_net.workspace = true
gc_platform.workspace = true
gc_render.workspace = true
gc_replay.workspace = true
gc_sim.workspace = true
gc_ui.workspace = true
glam.workspace = true
pollster.workspace = true
winit.workspace = true
tracy-client = { version = "0.18", optional = true }

[build-dependencies]
gc_bake.workspace = true

[lints]
workspace = true

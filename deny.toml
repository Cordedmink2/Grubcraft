# cargo-deny: checks the dependency tree for known security advisories,
# licences we have not agreed to ship, crates from unexpected places, and
# the same crate pulled in at two versions. Run in CI by the `deps` job;
# locally: `cargo deny check`.

[graph]
# The platforms we ship (Mac and Windows). Crates only built for other
# platforms are not checked; Linux is only a CI and development machine.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerabilities and unmaintained crates fail the build. When one hits a
# crate we cannot update, add its id below with the reason and a date to
# revisit; never leave one in silently.
ignore = []

[licenses]
# Permissive licences only. Anything else (GPL, ...) needs a decision from
# Mario before it goes in; the game's own crates are private.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
# Two versions of one crate is how binaries and build times grow. They are
# listed (not failed) so a new duplicate shows up in the CI log.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path, with no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

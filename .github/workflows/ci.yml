name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the whole of CI on the tagged commit and
  # publishes the zips this run builds.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: Tracy profiling build
        run: cargo clippy -p gc_game --features profile
      - name: Data reload build (dev feature)
        run: cargo clippy -p gc_game --all-targets --features dev

  test:
    # The determinism tests must produce identical hashes on every platform:
    # this is what lets Mac and Windows players share a lockstep match.
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-14 }
          - { name: Windows x64, os: windows-latest }
          - { name: Linux x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: cargo test --workspace
      - name: Data reload tests (dev feature)
        if: runner.os == 'Linux'
        run: cargo test -p gc_game --features dev
      - name: Determinism in release mode
        run: cargo test --release -p gc_sim --test determinism
      - name: Golden replays in release mode
        run: cargo run --release -p gc_replay -- verify replays
      - name: Maps are valid and fair
        run: cargo run --release -p gc_mapcheck -- check
      # The Warlord rehearses each plan in copies of the battle, which takes
      # minutes in a debug build, so its tests only run here.
      - name: Warlord in release mode
        if: runner.os == 'Linux'
        run: cargo test --release -p gc_ai --test versus warlord
      - name: Simulation benchmark and budgets
        run: cargo run --release -p gc_bench
      # Counts instructions under valgrind, which a busy runner cannot skew,
      # and compares them with tools/gc_bench/baseline.json.
      - name: Benchmark instruction counts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind
          python3 scripts/bench-gate.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && !cancelled()
        with:
          name: bench-instructions
          path: target/bench/instructions.json
          retention-days: 14

  smoke-linux:
    # The real game, started on a software GPU (Mesa's lavapipe) under a
    # virtual screen, drawing a battle; nothing else in CI ever creates a
    # GPU device. See scripts/smoke-run.py for what fails it.
    name: Smoke run (Linux, software GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - name: Virtual screen and software Vulkan
        run: sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
      - run: cargo build --release -p gc_game
      - name: Play a battle for 300 frames
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 scripts/smoke-run.py target/release/grubcraft
        env:
          WGPU_BACKEND: vulkan

  msrv:
    # `rust-version` in Cargo.toml is a promise that the game still builds
    # on that Rust; this keeps it true. Keep the version here in step with it.
    name: Oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          alsa: 'true'
      - run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - run: cargo +1.88.0 check --workspace --locked

  mac-app:
    name: macOS universal app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - run: ./scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Grubcraft-macOS
          path: target/Grubcraft-macOS.zip
          retention-days: 14

  windows-exe:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
      - run: ./scripts/bundle-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Grubcraft-Windows
          path: target/Grubcraft-Windows.zip
          retention-days: 14
      # After the upload, so a failing smoke run still leaves the zip to download.
      # The zip as friends get it, on Windows' software adapter (WARP).
      - name: Smoke run of the zip
        shell: pwsh
        run: |
          Expand-Archive target/Grubcraft-Windows.zip -DestinationPath target/smoke
          python scripts/smoke-run.py target/smoke/Grubcraft/grubcraft.exe

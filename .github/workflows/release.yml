name: Release

# Push a tag like v0.2.0 to publish a GitHub Release for it. The tag must
# match `version` in the root Cargo.toml. The whole of CI runs on the tagged
# commit first, and the release holds the very zips that CI built and tested.
# Run it by hand from the Actions tab (no tag) to rehearse: everything runs
# except publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in Cargo.toml. Change the version, commit, and tag again."
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: Grubcraft-*
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum Grubcraft-*.zip | tee SHA256SUMS
          gh release create "$TAG" \
            Grubcraft-macOS.zip Grubcraft-Windows.zip SHA256SUMS \
            --title "Grubcraft $TAG" \
            --generate-notes
